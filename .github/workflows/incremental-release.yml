name: Incremental compress & update zip

# רץ אוטומטית בכל push שמוסיף/משנה תמונות בתיקיית "מאגר תמונות mdy"
# מעדכן רק את התמונות שהשתנו (לא דוחס הכל מחדש) ומעדכן רק את קובצי ה-zip הרלוונטיים
on:
  push:
    branches: [main]
    paths:
      - 'מאגר תמונות mdy/**/*.webp'
      - 'מאגר תמונות mdy/**/*.jpg'
      - 'מאגר תמונות mdy/**/*.jpeg'
      - 'מאגר תמונות mdy/**/*.png'
  workflow_dispatch: {}

permissions:
  contents: write   # נדרש כדי לפרסם/לעדכן Release

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # מספיק כדי להשוות מול ה-commit הקודם

      - name: Install cwebp
        run: sudo apt-get update -y && sudo apt-get install -y webp

      - name: Configure git for Hebrew filenames
        run: git config core.quotePath false
        # קריטי: בלי זה, git עוטף שמות קבצים עם תווים לא-ASCII (עברית) במרכאות
        # ו-escape אוקטלי כשמוציא אותם ל-pipe, מה שגרם ל-grep על הסיומת (.webp)
        # להיכשל בשקט ולזהות 0 קבצים שהשתנו - למרות שבפועל השתנו.

      - name: Find changed image files
        id: changed
        run: |
          set -e
          BASE="HEAD~1"
          if ! git rev-parse "$BASE" >/dev/null 2>&1; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-only --diff-filter=ACM "$BASE" HEAD -- 'מאגר תמונות mdy' \
            | grep -E '\.(webp|jpg|jpeg|png)$' > changed_files.txt || true
          COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files: $COUNT"
          cat changed_files.txt

      - name: Compress only new/changed images (in place)
        if: steps.changed.outputs.count != '0'
        run: |
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.webp)
                cwebp -q 75 -m 6 "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
                ;;
              *)
                cwebp -q 75 -m 6 "$f" -o "${f%.*}.webp" && rm -f "$f"
                ;;
            esac
          done < changed_files.txt

      - name: Commit compressed images back to repo
        if: steps.changed.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'מאגר תמונות mdy'
          git diff --cached --quiet || git commit -m "chore: compress newly added/changed images [skip ci]"
          git push

      - name: Prepare "images" alias matching the archive layout
        if: steps.changed.outputs.count != '0'
        run: ln -sfn "מאגר תמונות mdy" images
        # קובצי ה-zip הקיימים (גם של מסכת בודדת וגם הראשי) עוטפים הכל בתיקיית
        # top-level בשם "images" ולא "מאגר תמונות mdy" - הקישור הזה שומר על אותה מבנה

      - name: Download existing zips to update incrementally
        if: steps.changed.outputs.count != '0'
        run: |
          mkdir -p release-assets
          curl -sL -o release-assets/images-latest.zip \
            "https://github.com/${{ github.repository }}/releases/download/latest/images-latest.zip" || true
          python3 - <<'PYEOF'
          import subprocess
          masechtot = set()
          with open("changed_files.txt", encoding="utf-8") as fh:
              for line in fh:
                  parts = line.strip().split("/")
                  if len(parts) >= 3 and parts[2]:
                      masechtot.add(parts[2])
          for m in sorted(masechtot):
              url = f"https://github.com/{__import__('os').environ['GH_REPO']}/releases/download/latest/masechet-{m}.zip"
              subprocess.run(["curl", "-sL", "-o", f"release-assets/masechet-{m}.zip", url])
          PYEOF
        env:
          GH_REPO: ${{ github.repository }}

      - name: Update only the affected masechet zip(s) AND the main combined zip
        if: steps.changed.outputs.count != '0'
        run: |
          python3 - <<'PYEOF'
          import os, subprocess

          groups = {}  # masechet_name -> seder/masechet relative path
          with open("changed_files.txt", encoding="utf-8") as fh:
              for line in fh:
                  parts = line.strip().split("/")
                  # parts[0]="מאגר תמונות mdy", parts[1]=seder, parts[2]=masechet
                  if len(parts) >= 3 and parts[1] and parts[2]:
                      groups[parts[2]] = f"{parts[1]}/{parts[2]}"

          print("Masechtot to update:", list(groups.keys()))

          for masechet_name, seder_masechet in groups.items():
              img_path = os.path.join("images", seder_masechet)
              if not os.path.isdir(img_path):
                  print(f"SKIP (not a dir): {img_path}")
                  continue

              masechet_zip = f"release-assets/masechet-{masechet_name}.zip"
              has_existing = os.path.isfile(masechet_zip) and os.path.getsize(masechet_zip) > 0
              if has_existing:
                  # verify it's a real zip
                  r = subprocess.run(["unzip", "-l", masechet_zip], capture_output=True)
                  has_existing = r.returncode == 0
              if not has_existing:
                  if os.path.exists(masechet_zip):
                      os.remove(masechet_zip)
                  subprocess.run(["zip", "-q", "-r", masechet_zip, img_path], check=True)
              else:
                  subprocess.run(["zip", "-q", "-u", "-r", masechet_zip, img_path], check=True)
              print(f"Updated {masechet_zip}")

              main_zip = "release-assets/images-latest.zip"
              has_main = os.path.isfile(main_zip) and os.path.getsize(main_zip) > 0
              if has_main:
                  r = subprocess.run(["unzip", "-l", main_zip], capture_output=True)
                  has_main = r.returncode == 0
              if not has_main:
                  if os.path.exists(main_zip):
                      os.remove(main_zip)
                  subprocess.run(["zip", "-q", "-r", main_zip, img_path], check=True)
              else:
                  subprocess.run(["zip", "-q", "-u", "-r", main_zip, img_path], check=True)
              print(f"Updated {main_zip} (מסכת {masechet_name})")
          PYEOF

      - name: Upload updated zip(s) to the "latest" release
        if: steps.changed.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: release-assets/*.zip
