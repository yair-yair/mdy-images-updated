import os
import subprocess
import json

BATCH_SIZE = 160
PROGRESS_FILE = "compressed_files.json"
TARGET_DIR = "."  # הנתיב שבו נמצאים הקבצים

def load_processed():
    if os.path.exists(PROGRESS_FILE):
        with open(PROGRESS_FILE, "r", encoding="utf-8") as f:
            return set(json.load(f))
    return set()

def save_processed(processed_set):
    with open(PROGRESS_FILE, "w", encoding="utf-8") as f:
        json.dump(list(processed_set), f, indent=2)

def compress_webp():
    processed = load_processed()
    
    # איסוף כל קבצי WebP או התמונות שטרם עובדו
    all_files = []
    for root, _, files in os.walk(TARGET_DIR):
        for file in files:
            if file.lower().endswith(('.webp', '.png', '.jpg', '.jpeg')):
                full_path = os.path.join(root, file)
                if full_path not in processed:
                    all_files.append(full_path)
                    
    all_files.sort()
    
    if not all_files:
        print("ללא קבצים חדשים לדחיסה.")
        return

    batch = all_files[:BATCH_SIZE]
    print(f"מעבד {len(batch)} קבצים מתוך {len(all_files)} שנותרו...")

    for file_path in batch:
        try:
            # דוגמה להרצת cwebp (התאם את הפרמטרים במידת הצורך)
            output_path = file_path  # דריסה או שמירה בשם חדש
            cmd = ["cwebp", "-q", "80", file_path, "-o", output_path]
            
            result = subprocess.run(cmd, capture_output=True, text=True)
            if result.returncode == 0:
                processed.add(file_path)
            else:
                print(f"שגיאה בדחיסת {file_path}: {result.stderr}")
        except Exception as e:
            print(f"שגיאה בקובץ {file_path}: {e}")

    save_processed(processed)
    print(f"הסתיים עיבוד המנה. סה\"כ עובדו עד כה: {len(processed)}")

if __name__ == "__main__":
    compress_webp()
