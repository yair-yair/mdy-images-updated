name: Release image archive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC, in case content changes without a push
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      ROOT: "מאגר תמונות mdy"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install webp tools (cwebp, webpinfo)
        run: sudo apt-get update -qq && sudo apt-get install -y webp

      - name: Compress any not-yet-compressed images
        run: |
          python3 compress_webp_cwebp.py "$ROOT"

      - name: Commit compressed images back to the repo (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ROOT" compress_progress.log compress_progress_resize.log compress_errors.log compress_errors_resize.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-compress images before building download archives [skip ci]"
            git push
            echo "committed compression changes"
          else
            echo "nothing to commit - all images already compressed"
          fi

      # Hebrew name -> ASCII slug, so uploaded release asset filenames survive
      # GitHub's release-asset upload (which does not support non-ASCII names).
      # The Hebrew names are preserved as the actual folder/file names *inside* each zip.
      - name: Build zip archives (full / per seder / per masechet)
        run: |
          set -e
          mkdir -p dist

          declare -A SLUG=(
            ["סדר זרעים"]="seder-1-zeraim"
            ["סדר מועד"]="seder-2-moed"
            ["סדר נשים"]="seder-3-nashim"
            ["סדר נזיקין"]="seder-4-nezikin"
            ["סדר קדשים"]="seder-5-kodashim"
            ["סדר טהרות"]="seder-6-taharot"

            ["ברכות"]="berachot" ["פאה"]="peah" ["דמאי"]="demai" ["כלאים"]="kilayim"
            ["שביעית"]="sheviit" ["תרומות"]="terumot" ["מעשרות"]="maasrot"
            ["מעשר שני"]="maaser-sheni" ["חלה"]="challah" ["ערלה"]="orlah" ["ביכורים"]="bikkurim"

            ["שבת"]="shabbat" ["עירובין"]="eruvin" ["פסחים"]="pesachim" ["שקלים"]="shekalim"
            ["יומא"]="yoma" ["סוכה"]="sukkah" ["ביצה"]="beitzah" ["ראש השנה"]="rosh-hashanah"
            ["תענית"]="taanit" ["מגילה"]="megillah" ["מועד קטן"]="moed-katan" ["חגיגה"]="chagigah"

            ["יבמות"]="yevamot" ["כתובות"]="ketubot" ["נדרים"]="nedarim" ["נזיר"]="nazir"
            ["סוטה"]="sotah" ["גיטין"]="gittin" ["קידושין"]="kiddushin"

            ["בבא קמא"]="bava-kamma" ["בבא מציעא"]="bava-metzia" ["בבא בתרא"]="bava-batra"
            ["סנהדרין"]="sanhedrin" ["מכות"]="makkot" ["שבועות"]="shevuot" ["עדיות"]="eduyot"
            ["עבודה זרה"]="avodah-zarah" ["אבות"]="avot" ["הוריות"]="horayot"

            ["זבחים"]="zevachim" ["מנחות"]="menachot" ["חולין"]="chullin" ["בכורות"]="bechorot"
            ["ערכין"]="arachin" ["תמורה"]="temurah" ["כריתות"]="keritot" ["מעילה"]="meilah"
            ["תמיד"]="tamid" ["מידות"]="middot" ["קינים"]="kinnim"

            ["כלים"]="keilim" ["אהלות"]="oholot" ["נגעים"]="negaim" ["פרה"]="parah"
            ["טהרות"]="taharot-masechet" ["מקואות"]="mikvaot" ["נדה"]="niddah"
            ["מכשירין"]="machshirin" ["זבים"]="zavim" ["טבול יום"]="tevul-yom"
            ["ידיים"]="yadayim" ["עוקצין"]="uktzin"
          )

          slug_for() {
            local name="$1"
            if [ -n "${SLUG[$name]}" ]; then
              echo "${SLUG[$name]}"
            else
              echo "misc-$(echo -n "$name" | md5sum | cut -c1-8)"
            fi
          }

          REPO_ROOT="$PWD"

          echo "== Full archive =="
          if [ -d "$ROOT" ]; then
            zip -r -q "$REPO_ROOT/dist/images-latest.zip" "$ROOT" \
              -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                 '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF'
          fi

          echo "== Per-seder archives (only seders that contain images) =="
          MAP_NOTES="$REPO_ROOT/dist/mapping.txt"
          : > "$MAP_NOTES"
          if [ -d "$ROOT" ]; then
            find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' seder; do
              seder_name="${seder##*/}"
              count=$(find "$seder" -type f \( \
                -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o \
                -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' -o -iname '*.tiff' \
              \) | wc -l)
              if [ "$count" -gt 0 ]; then
                slug=$(slug_for "$seder_name")
                out="$REPO_ROOT/dist/${slug}.zip"
                # zip the Hebrew-named seder folder itself (not its bare contents),
                # so the extracted top-level folder keeps its Hebrew name.
                ( cd "$ROOT" && zip -r -q "$out" "$seder_name" \
                    -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                       '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF' )
                echo "${slug}.zip = $seder_name ($count images)" >> "$MAP_NOTES"
              fi
            done
          fi

          echo "== Per-masechet archives (only masechtot that directly contain images) =="
          if [ -d "$ROOT" ]; then
            find "$ROOT" -mindepth 2 -maxdepth 2 -type d -print0 | while IFS= read -r -d '' masechet; do
              masechet_name="${masechet##*/}"
              masechet_parent="${masechet%/*}"
              count=$(find "$masechet" -maxdepth 1 -type f \( \
                -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o \
                -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' -o -iname '*.tiff' \
              \) | wc -l)
              if [ "$count" -gt 0 ]; then
                slug=$(slug_for "$masechet_name")
                out="$REPO_ROOT/dist/masechet-${slug}.zip"
                # zip the Hebrew-named masechet folder itself from its parent
                # (previously this cd'd INTO the masechet dir and zipped ".",
                # which dropped the Hebrew folder name entirely on extraction).
                ( cd "$masechet_parent" && zip -r -q "$out" "$masechet_name" \
                    -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                       '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF' )
                echo "masechet-${slug}.zip = $masechet_name ($count images)" >> "$MAP_NOTES"
              fi
            done
          fi

          echo "== Result =="
          ls -la dist
          echo "== Mapping =="
          cat "$MAP_NOTES" || true

      - name: Build release notes with the file-name mapping
        run: |
          {
            echo "קבצים אוטומטיים, מתעדכנים בכל push ל-main ופעם ביום."
            echo "כל תמונה עוברת קודם דחיסת cwebp (איכות 75) לפני שהיא נכנסת לקבצי ההורדה."
            echo ""
            echo "- images-latest.zip: כל המאגר"
            echo ""
            echo "מיפוי בין שם הקובץ באנגלית (שם התיקייה בפועל בעברית):"
            echo '```'
            cat dist/mapping.txt
            echo '```'
          } > release_body.md

      - name: Publish / update "latest" release with all archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest image archives (auto-updated)"
          body_path: release_body.md
          files: |
            dist/*.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
