name: Release image archive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC, in case content changes without a push
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      ROOT: "מאגר תמונות mdy"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zip archives (full / per seder / per masechet)
        run: |
          set -e
          mkdir -p dist

          echo "== Full archive =="
          if [ -d "$ROOT" ]; then
            zip -r -q "dist/images-latest.zip" "$ROOT" \
              -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                 '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF'
          fi

          echo "== Per-seder archives (only seders that contain images) =="
          if [ -d "$ROOT" ]; then
            find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' seder; do
              seder_name="${seder##*/}"
              count=$(find "$seder" -type f \( \
                -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o \
                -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' -o -iname '*.tiff' \
              \) | wc -l)
              echo "seder found: [$seder_name] images=$count"
              if [ "$count" -gt 0 ]; then
                out="dist/seder-${seder_name}.zip"
                ( cd "$ROOT" && zip -r -q "../$out" "$seder_name" \
                    -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                       '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF' )
                echo "created $out"
              fi
            done
          fi

          echo "== Per-masechet archives (only masechtot that directly contain images) =="
          if [ -d "$ROOT" ]; then
            find "$ROOT" -mindepth 2 -maxdepth 2 -type d -print0 | while IFS= read -r -d '' masechet; do
              masechet_name="${masechet##*/}"
              count=$(find "$masechet" -maxdepth 1 -type f \( \
                -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o \
                -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' -o -iname '*.tiff' \
              \) | wc -l)
              echo "masechet found: [$masechet_name] images=$count"
              if [ "$count" -gt 0 ]; then
                out="dist/masechet-${masechet_name}.zip"
                ( cd "$masechet" && zip -r -q "../../../$out" . \
                    -i '*.jpg' '*.jpeg' '*.png' '*.gif' '*.webp' '*.bmp' '*.tiff' \
                       '*.JPG' '*.JPEG' '*.PNG' '*.GIF' '*.WEBP' '*.BMP' '*.TIFF' )
                echo "created $out"
              fi
            done
          fi

          echo "== Result =="
          ls -la dist

      - name: Publish / update "latest" release with all archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest image archives (auto-updated)"
          body: |
            קבצים אוטומטיים, מתעדכנים בכל push ל-main ופעם ביום:
            - images-latest.zip: כל המאגר
            - seder-<שם הסדר>.zip: קובץ לכל סדר שיש בו תמונות
            - masechet-<שם המסכת>.zip: קובץ לכל מסכת שיש בה תמונות
          files: dist/*.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
